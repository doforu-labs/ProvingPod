name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build --network host -t proving-gw:v1 gateway/
      - name: Build userenv image
        run: docker build --network host -t proving-pod:v1 userenv/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck gateway/*.sh userenv/*.sh deploy/*.sh
