# ProvingPod SSH dynamic user system - Docker edition orchestration
# Usage: docker compose -f docker-compose.yml up -d
# Prereq: the two images exist locally. Either build them on x86_64 with deploy.sh,
# or pre-pull the published ones on any host:
#   GATEWAY_IMAGE=ghcr.io/yctech2026/provingpod-gateway:v0.1.0 \
#   USERENV_IMAGE=ghcr.io/yctech2026/provingpod-pod:v0.1.0 \
#     docker compose -f docker-compose.yml up -d --pull always
services:
  gateway:
    image: proving-gw:v1
    container_name: provingpod-gateway
    restart: unless-stopped
    ports:
      - "6901:22"            # SSH entrypoint (host 6901 -> gateway 22)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # gateway drives the host docker daemon
      # note: the Docker CLI is NOT bind-mounted from the host any more — it ships inside the image.
      # A mounted host binary only works while host and image share an architecture, which is never
      # the case on an arm64 host running this amd64 image: sudo -n docker dies with
      # "cannot execute: required file not found", the PAM account hook fails, and the session is
      # dropped right after a correct password.
      - provingpod-data:/data                        # lastseen / port records persistence
    environment:
      - USER_IMAGE=proving-pod:v1
      - MAX_USERS=8
    # key: sshd privilege separation requires SYS_CHROOT (login fails without it, verified); NET_BIND_SERVICE binds 22
    # key: AUDIT_WRITE is REQUIRED for sshd PTY sessions (client -t/-tt): sshd writes an audit record after
    #      authentication (linux_audit_write_entry); without it the pty session is killed -> "Connection closed by
    #      remote host" immediately after pty-req. Verified 2026-08-09 on T470s (Docker 29.1.3, kernel 6.17).
    # note: cap_drop ALL + the caps above work fine; sudo docker must be executable by the non-root session user,
    # but no-new-privileges must stay false or sudo fails
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind port 22
      - SYS_CHROOT         # sshd privilege separation chroot (required!)
      - SETUID             # drop privileges to the virtual user
      - SETGID
      - CHOWN
      - DAC_OVERRIDE       # non-root session user accesses docker.sock via sudo -n docker
      - AUDIT_WRITE        # sshd PTY session audit write (required for -t/-tt login!)
    security_opt:
      - no-new-privileges:false
    healthcheck:
      test: ["CMD", "sshd", "-T"]
      interval: 30s
      timeout: 5s
      retries: 3

# User environment containers (hex_<user>) are created dynamically by the gateway, not statically defined in compose:
#   docker run -d --name hex_<user> --memory 2g --cpus 2 \
#     -p 6901 -p 5900 \
#     proving-pod:v1 /start.sh
# Ports are auto-assigned randomly by docker (avoiding conflicts); the actual ports are recorded in /data/ephemeral-users/<user>.ports
# TTL cleanup: host systemd timer docker-ephemeral-cleanup.timer (hourly, lastseen TTL 3 days + orphan fallback)

volumes:
  provingpod-data:
